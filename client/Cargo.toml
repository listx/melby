[package]
name = "melbyc"
description = "melby client"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
prost = "0.14"
clap = { version = "4.6", features = ["derive"]}
config = { version = "0.15", features = ["yaml"]}

[build-dependencies]
tonic-prost-build = "0.14"

[[bin]]
name = "melbyc"
path = "src/main.rs"

[profile.release]
# Strip all symbols.
strip = true

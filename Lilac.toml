name = "Melby"
homepage = "https://github.com/listx/melby"
repo = "https://github.com/listx/melby"
version = ""
nonTangledPathspecs = [
    # Legalese.
    ":(exclude,top)LICENSE",

    # Lilac sources.
    ":(exclude,top,glob)*.org",

    # Build system metadata.
    ":(exclude,top)client/Cargo.lock",

    # Generated by client/build.rs.
    ":(exclude,top)client/src/grpc_generated/melby_client.rs",

    # Generated gRPC stubs (Elixir).
    ":(exclude,top)daemon/lib/generated",

    # Build system metadata.
    ":(exclude,top)daemon/lib/melbyd/nifs/Cargo.lock",

    # Legalese.
    ":(exclude,top)daemon/lib/melbyd/renderer/LICENSE",

    # Needed for Haskell+Stack integration.
    ":(exclude,top)daemon/lib/melbyd/renderer/stack.nix",

    # Build system metadata.
    ":(exclude,top)daemon/lib/melbyd/renderer/stack.yaml.lock",

    # Build system metadata.
    ":(exclude,top)daemon/mix.lock",

    # Generated by mix2nix.
    ":(exclude,top)daemon/mix.nix",

    # Generated SVG output (TikZ->PDF->SVG).
    ":(exclude,top)image/architecture-overall.svg",

    # Generated by Niv.
    ":(exclude,top)package/nix/sources.json",
    ":(exclude,top)package/nix/sources.nix"
]

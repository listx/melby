name = "Melby"
homepage = "https://github.com/listx/melby"
repo = "https://github.com/listx/melby"
version = ""
nonTangledPathspecs = [
    # Generated by Git itself.
    ":(exclude,top).gitmodules",

    # Legalese.
    ":(exclude,top)LICENSE",

    # Lilac sources.
    ":(exclude,top,glob)*.org",

    # Emacs packages for lilac-legacy (Git submodules).
    ":(exclude,top)deps/elisp",

    # Build system metadata.
    ":(exclude,top)client-rust/Cargo.lock",

    # Copied over from toplevel proto in Makefile.
    ":(exclude,top)client-rust/proto/melby_client.proto",

    # Generated by client-rust/build.rs.
    ":(exclude,top)client-rust/src/grpc_generated/melby_client.rs",

    # Legalese, same as toplevel (copied over in Makefile).
    ":(exclude,top)client/LICENSE",

    # Copied over from toplevel proto in Makefile.
    ":(exclude,top)client/lib/MelbyClient/melby_client.proto",

    # Needed for Haskell+Stack integration.
    ":(exclude,top)client/stack.nix",

    # Build system metadata.
    ":(exclude,top)client/stack.yaml.lock",

    # Generated gRPC stubs (Elixir).
    ":(exclude,top)daemon/lib/generated",

    # Build system metadata.
    ":(exclude,top)daemon/lib/melbyd/nifs/Cargo.lock",

    # Legalese.
    ":(exclude,top)daemon/lib/melbyd/renderer/LICENSE",

    # Copied over from toplevel proto in Makefile.
    ":(exclude,top)daemon/lib/melbyd/renderer/lib/MelbyRenderer/melby_renderer.proto",

    # Needed for Haskell+Stack integration.
    ":(exclude,top)daemon/lib/melbyd/renderer/stack.nix",

    # Build system metadata.
    ":(exclude,top)daemon/lib/melbyd/renderer/stack.yaml.lock",

    # Build system metadata.
    ":(exclude,top)daemon/mix.lock",

    # Generated by mix2nix.
    ":(exclude,top)daemon/mix.nix",

    # Generated SVG output (TikZ->PDF->SVG).
    ":(exclude,top)image/architecture-overall.svg",

    # Symlinks to lilac-legacy.
    ":(exclude,top)lilac.css",
    ":(exclude,top)lilac.js",
    ":(exclude,top)lilac.theme",
    ":(exclude,top)syntax-highlighting.css",

    # Generated by Niv.
    ":(exclude,top)package/nix/sources.json",
    ":(exclude,top)package/nix/sources.nix"
]

syntax = "proto3";

package melby_client;

// melbyc <-> melbyd communication
service View {
  rpc GetView (ViewRequest) returns (ViewResponse);
}

message ViewRequest {
  // Path to Lua configuration. Delegates reading the config to the daemon.
  string config_path = 1;

  // Lua configuration that is given directly. Currently unusued by the daemon.
  string config = 2;

  // Environment variables ((name, value) pairs) of interest.
  map<string, string> env_vars = 3;

  // Process ID number of the running (interactive) shell program.
  string shell_pid = 4;
}

message ViewResponse {
  // Status of this response message.
  ViewStatus status = 1;

  // String result of running Lua script.
  string view = 2;

  // Error message from melbyd, if any.
  string error = 3;
}

enum ViewStatus {
  VIEW_STATUS_UNSPECIFIED = 0;
  VIEW_STATUS_ERROR = 1;
  VIEW_STATUS_OK = 2;
  // melbyd could not generate the view in time. The view is a placeholder
  // (possibly empty), and the real view will be ready for a later request.
  VIEW_STATUS_PENDING = 3;
}

// melbyc asks melbyd which build of melbyd is running.
service Version {
  rpc GetVersion (VersionRequest) returns (VersionResponse);
}

message VersionRequest {}

message VersionResponse {
  // Version of melbyd, from its mix.exs.
  string version = 1;

  // Root directory of the running melbyd release. For a release built with
  // Nix, this is its path in the Nix store.
  string root_dir = 2;

  // Git commit that melbyd was built from, such as "9ce7bd1" or
  // "9ce7bd1-dirty", or "unknown".
  string git_rev = 3;
}
